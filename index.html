
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video,
    iframe {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      border: none;
    }

    video {
      object-fit: contain;
    }

    .player {
      width: 100%;
      max-width: 1200px;
    }
  </style>
</head>
<body>

  <div class="player">
    <video controls autoplay playsinline>
      <source src="https://bramblestack.s3.eu-north-1.amazonaws.com/rays_1080p30.m3u8" type="video/mp4">
      Your browser does not support HTML video.
    </video>
  </div>

</body>
</html>
